[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP server exposing NRL Capstone fact tools (scene, research, math)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9,<2",
    "fixture-scene",
    "qualitative-research",
    "mathematical-engine",
]

[project.scripts]
nrl-mcp = "gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.uv.sources]
fixture-scene = { path = "../fixture_scene", editable = true }
qualitative-research = { path = "../qualitative_research", editable = true }
mathematical-engine = { path = "../mathematical_engine", editable = true }
