[project]
name = "mathematical-engine"
version = "0.1.0"
description = "Deterministic mathematical engine for NRL match prediction (ETL, XGBoost, SHAP, FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.9.0",
    "optuna>=4.9.0",
    "shap>=0.52.0",
    "matplotlib>=3.11.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.49.0",
]
