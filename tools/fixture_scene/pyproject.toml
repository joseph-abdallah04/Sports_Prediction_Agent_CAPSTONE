[project]
name = "fixture-scene"
version = "0.1.0"
description = "NRL fixture scene setter: draw/match-centre context + Open-Meteo weather"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scene"]
